  - name: yt-chat-tts
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_INSTALL_PREFIX=/app/plugins/YtChatTts
      - -DCMAKE_PREFIX_PATH=/app
      - -DBUILD_TESTING=OFF
      - -DBUILD_SUPERTONIC_PROBE=ON
      - -DONNXRUNTIME_ROOT=/app/plugins/YtChatTts
    post-install:
      - install -Dm644 --target-directory=${FLATPAK_DEST}/share/metainfo ${FLATPAK_BUILDER_BUILDDIR}/${FLATPAK_ID}.metainfo.xml
      # ONNX Runtime headers are build-only; the shared libraries remain.
      - rm -rf ${FLATPAK_DEST}/include
      - rm -f ${FLATPAK_DEST}/patchelf
    sources:
      - type: dir
        path: ..
      - type: file
        path: com.obsproject.Studio.Plugin.YtChatTts.metainfo.xml
